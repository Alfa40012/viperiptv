<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>RAFAL PAY - Pay Now</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 800px;
      background: #020617;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border: 1px solid #1f2937;
    }
    .banner {
      width: 100%;
      border-radius: 16px;
      margin-bottom: 16px;
      object-fit: cover;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.4rem;
      text-align: center;
      color: #f9fafb;
    }
    label {
      display: block;
      margin: 10px 0 4px;
      font-size: 0.9rem;
      color: #9ca3af;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      box-sizing: border-box;
    }
    textarea {
      width: 100%;
      min-height: 200px;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      box-sizing: border-box;
      resize: vertical;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    .btn-outline {
      background: transparent;
      color: #e5e7eb;
      border: 1px solid #4b5563;
    }
    .hint {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- لو عندك بانر، حط صورته في نفس الفولدر وغير الاسم هنا -->
    <!-- <img src="rafalpay-banner.jpg" alt="RAFAL PAY Banner" class="banner" /> -->

    <h1>مولّد رسالة الدفع – RAFAL PAY</h1>

    <label for="link">رابط الدفع (Paysky أو غيره):</label>
    <input
      type="text"
      id="link"
      value="https://cube.paysky.io/?R=FtbJgA"
      placeholder="ضع هنا رابط الدفع للعميل"
    />

    <div class="btn-row">
      <button class="btn-primary" onclick="generate()">توليد الرسالة</button>
      <button class="btn-outline" onclick="copyMsg()">نسخ الرسالة</button>
      <button class="btn-outline" onclick="copyLink()">نسخ الرابط فقط</button>
    </div>

    <label for="msg">الرسالة الجاهزة (انسخها وأرسلها مع الصورة):</label>
    <textarea id="msg" readonly></textarea>

    <div class="hint">
      ◀ ابعت الصورة (البانر) + النص الجاهز للعميل على واتساب.<br>
      كل مرة تغيّر الرابط فوق وتضغط "توليد الرسالة" فقط.
    </div>
  </div>

  <script>
    function makeMessage(link) {
      return (
`حيّاكم الله في متجر RAFAL PAY 🤍

نوفر لكم طرق دفع آمنة وسريعة ومتعددة:
• PayPal
• mada
• Apple Pay
• Visa
• MasterCard

لإتمام عملية الدفع يرجى الضغط على الرابط التالي:
🔗 ${link}

بعد الدفع فضلاً إرسال صورة الإيصال ليتم تفعيل خدمتك فورًا ✨
نحن في خدمتك دائماً 🤝`
      );
    }

    function generate() {
      const link = document.getElementById('link').value.trim();
      const msgArea = document.getElementById('msg');
      if (!link) {
        alert('حط رابط الدفع الأول.');
        return;
      }
      msgArea.value = makeMessage(link);
    }

    function copyMsg() {
      const ta = document.getElementById('msg');
      if (!ta.value) generate();
      ta.select();
      document.execCommand('copy');
      alert('تم نسخ الرسالة ✅');
    }

    function copyLink() {
      const linkInput = document.getElementById('link');
      linkInput.select();
      document.execCommand('copy');
      alert('تم نسخ رابط الدفع ✅');
    }

    // توليد أول رسالة تلقائياً
    window.onload = generate;
  </script>
</body>
</html>
